let S,keys={},ptr=null,last=0,fireHeld=false;
const music=(()=>{let ac,gain,next=0,step=0,on=true,timer;
 const bass=[110,110,98,98,87.31,87.31,98,98],lead=[440,0,523.25,0,659.25,523.25,440,0,392,0,493.88,0,587.33,493.88,392,0];
 function note(f,t,d,type,v){const o=ac.createOscillator(),e=ac.createGain();o.type=type;o.frequency.value=f;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(e);e.connect(gain);o.start(t);o.stop(t+d+.02)}
 function kick(t){const o=ac.createOscillator(),e=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);e.gain.setValueAtTime(.5,t);e.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(e);e.connect(gain);o.start(t);o.stop(t+.15)}
 function tick(){if(!on||S.state!=='play'){next=ac.currentTime+.05;return}
  const d=Math.max(.09,.16-S.level*.008);
  while(next<ac.currentTime+.2){const s=step%16;
   if(s%2===0)note(bass[(s>>1)%8],next,d*1.9,'triangle',.45);
   if(lead[s])note(lead[s],next,d*.9,'square',.07);
   if(s%4===0)kick(next);
   next+=d;step++}}
 return{start(){if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();gain=ac.createGain();gain.gain.value=.6;gain.connect(ac.destination);next=ac.currentTime+.1;timer=setInterval(tick,50)}if(ac.state==='suspended')ac.resume()},
  toggle(){on=!on},isOn(){return on},
  sfx(k){if(!ac||!on)return;const seq=(a,ty,v,t)=>{t=t||ac.currentTime+.02;for(const[f,d]of a){if(f)note(f,t,d*1.15,ty,v);t+=d}};
   if(k==='life')seq([[392,.07],[311,.07],[233,.07],[156,.22]],'sawtooth',.2);
   if(k==='over'){const t=ac.currentTime+.02;seq([[110,.3],[82,.3]],'sawtooth',.22,t);seq([[330,.18],[311,.18],[294,.18],[262,.18],[247,.28],[196,.6]],'square',.14,t+.65)}
   if(k==='win')seq([[523,.1],[659,.1],[784,.1],[1047,.18],[784,.09],[1047,.09],[1319,.5],[1047,.12],[1319,.6]],'square',.15)}}})();
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();if((e.clientY-r.top)/r.height*H<44&&Math.abs((e.clientX-r.left)/r.width*W-W/2)<40)music.toggle()});
function reset(full){if(full)S={score:0,lives:3,level:1,state:'title'};
 Object.assign(S,{ship:{x:W/2,y:H-80,tx:W/2},shots:[],bolts:[],al:[],dir:1,cool:0,inv:0,t:0,parts:[]});
 for(let r=0;r<4;r++)for(let c=0;c<7;c++)S.al.push({x:46+c*58,y:60+r*50,w:50,h:36});}
reset(true);
let best=0;try{best=+localStorage.getItem('fibest')||0}catch(e){}
function over(){if(S.state==='over')return;S.state='over';S.newBest=best>0&&S.score>best;if(S.score>best){best=S.score;try{localStorage.setItem('fibest',best)}catch(e){}}music.sfx(S.newBest?'win':'over')}
function start(){music.start();if(S.state!=='play'){if(S.state==='over')reset(true);S.state='play';}}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyM')music.toggle();if(e.code==='Space'||e.code==='Enter')start();if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
function px(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',e=>{start();ptr=px(e);fireHeld=true;});
cv.addEventListener('pointermove',e=>{if(fireHeld)ptr=px(e)});
addEventListener('pointerup',()=>{fireHeld=false;ptr=null});
function boom(x,y){for(let i=0;i<14;i++)S.parts.push({x,y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,l:.5,c:Math.random()<.5?'#f2a93b':'#ff4d4d'})}
function star(x,y,r,rot,col){g.save();g.translate(x,y);g.rotate(rot);g.strokeStyle=col;g.lineWidth=3;g.lineCap='round';g.beginPath();
 for(let i=0;i<3;i++){const a=i*Math.PI/3;g.moveTo(Math.cos(a)*r,Math.sin(a)*r);g.lineTo(-Math.cos(a)*r,-Math.sin(a)*r)}g.stroke();g.restore()}
function update(dt){
 for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}}
 if(S.state!=='play')return;
 S.t+=dt;const sh=S.ship;
 if(keys.ArrowLeft||keys.KeyA)sh.x-=300*dt;if(keys.ArrowRight||keys.KeyD)sh.x+=300*dt;
 if(ptr!==null)sh.x+=Math.max(-420*dt,Math.min(420*dt,ptr-sh.x));
 sh.x=Math.max(30,Math.min(W-30,sh.x));
 S.cool-=dt;S.inv-=dt;
 if((keys.Space||fireHeld)&&S.cool<=0){S.shots.push({x:sh.x,y:sh.y-50});S.cool=.28}
 for(const b of S.shots)b.y-=520*dt;S.shots=S.shots.filter(b=>b.y>-20);
 // aliens
 const sp=40+(28-S.al.length)*6+S.level*12;let edge=false;
 for(const a of S.al){a.x+=S.dir*sp*dt;if(a.x<10||a.x+a.w>W-10)edge=true}
 if(edge){S.dir*=-1;for(const a of S.al){a.y+=18;a.x+=S.dir*4}}
 if(Math.random()<dt*(0.8+S.level*.3)&&S.al.length){const a=S.al[Math.random()*S.al.length|0];S.bolts.push({x:a.x+a.w/2,y:a.y+a.h})}
 for(const b of S.bolts)b.y+=230*dt;S.bolts=S.bolts.filter(b=>b.y<H+10);
 for(const b of S.shots)for(const a of S.al)if(!a.dead&&!b.dead&&b.x>a.x&&b.x<a.x+a.w&&b.y>a.y&&b.y<a.y+a.h){a.dead=b.dead=1;S.score+=10*S.level;boom(a.x+25,a.y+18)}
 S.al=S.al.filter(a=>!a.dead);S.shots=S.shots.filter(b=>!b.dead);
 if(S.inv<=0)for(const b of S.bolts)if(Math.abs(b.x-sh.x)<24&&b.y>sh.y-26&&b.y<sh.y+26){b.y=H+99;S.lives--;S.inv=1.5;boom(sh.x,sh.y);if(S.lives<=0)over();else music.sfx('life')}
 if(S.al.some(a=>a.y+a.h>sh.y-30))over();
 if(!S.al.length){S.level++;const sc=S.score,l=S.level,lv=S.lives;reset(false);S.level=l}
 for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}S.parts=S.parts.filter(p=>p.l>0);
}
function txt(t,y,sz,col){g.fillStyle=col||'#fdf3e3';g.font=`bold ${sz}px "Courier New",monospace`;g.textAlign='center';g.fillText(t,W/2,y)}
function draw(){
 g.fillStyle='#05030f';g.fillRect(0,0,W,H);
 const gr=g.createRadialGradient(W*.7,H*.3,10,W*.7,H*.3,420);gr.addColorStop(0,'#2a1050');gr.addColorStop(1,'#05030f');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='#fff';for(const s of stars)g.fillRect(s.x,s.y,s.s,s.s);
 const f=(performance.now()/400|0)%2;
 for(const a of S.al)g.drawImage(AL[f],a.x,a.y,a.w,a.h);
 for(const b of S.shots)star(b.x,b.y,9,performance.now()/120,'#fff');
 g.fillStyle='#ff5a3c';for(const b of S.bolts){g.fillRect(b.x-2,b.y,4,14);g.fillStyle='#f2a93b';g.fillRect(b.x-1,b.y+10,2,6);g.fillStyle='#ff5a3c'}
 for(const p of S.parts){g.globalAlpha=Math.max(0,p.l*2);g.fillStyle=p.c;g.fillRect(p.x,p.y,4,4)}g.globalAlpha=1;
 if(S.state!=='over'&&(S.inv<=0||(performance.now()/100|0)%2)&&shipImg.complete){const sh=S.ship;g.drawImage(shipImg,sh.x-36,sh.y-36,72,72)}
 g.textAlign='left';g.fillStyle='#fdf3e3';g.font='bold 16px "Courier New",monospace';g.fillText('SCORE '+S.score,12,24);
 g.textAlign='right';g.fillText('LVL '+S.level+'   LIVES '+'♥'.repeat(Math.max(0,S.lives)),W-12,24);g.textAlign='center';g.fillStyle='#8aa0c8';g.fillText(music.isOn()?'♪ ON':'♪ OFF',W/2,24);
 if(S.state==='title'){g.fillStyle='rgba(5,3,15,.7)';g.fillRect(0,190,W,270);txt('FEST INVADERS',235,34,'#ff8a4c');txt('Our Film Fest is under attack!',278,16);txt('Protect it from the DiPS pests!',302,16,'#f2a93b');txt('Shoot them all before they land.',326,14);
  txt('← → / A D move · SPACE shoot',368,14);txt('Touch: drag to move, auto-fires',388,14);txt('PRESS SPACE / TAP TO START',432,16,'#6fa0ff')}
 if(S.state==='over'){g.fillStyle='rgba(5,3,15,.75)';g.fillRect(0,220,W,190);txt(S.newBest?'NEW HIGH SCORE!':'GAME OVER',275,S.newBest?30:36,S.newBest?'#f2a93b':'#ff5a3c');txt('Score: '+S.score+'   Best: '+best,315,18);txt('SPACE / TAP TO PLAY AGAIN',370,16,'#6fa0ff')}
}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
